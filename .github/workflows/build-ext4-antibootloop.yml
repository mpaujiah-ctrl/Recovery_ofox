name: Build OrangeFox - cepheus (ext4-only, anti-bootloop)

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: 'URL device tree'
        required: true
        default: 'https://github.com/JoK3rLeE/twrp_cepheus'
      device_tree_branch:
        description: 'Branch device tree'
        required: true
        default: 'ofox_12.1-legacy'
      manifest_branch:
        description: 'OrangeFox manifest branch'
        required: true
        default: '12.1'
      device_name:
        description: 'Codename device'
        required: true
        default: 'cepheus'
      device_path:
        description: 'Path device tree di dalam source tree'
        required: true
        default: 'device/xiaomi/cepheus'
      lunch_target:
        description: 'Lunch combo (lihat AndroidProducts.mk / COMMON_LUNCH_CHOICES)'
        required: true
        default: 'twrp_cepheus-eng'
      build_target:
        description: 'Target make (recoveryimage / bootimage)'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl \
            flex g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 openjdk-8-jdk
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global color.ui false

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync OrangeFox source (fox_${{ github.event.inputs.manifest_branch }})
        run: |
          mkdir -p ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync/sync
          cd ~/OrangeFox_sync/sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.manifest_branch }} --path ~/fox_${{ github.event.inputs.manifest_branch }}

      - name: Clone device tree
        run: |
          rm -rf ~/fox_${{ github.event.inputs.manifest_branch }}/${{ github.event.inputs.device_path }}
          git clone ${{ github.event.inputs.device_tree_url }} \
            -b ${{ github.event.inputs.device_tree_branch }} \
            ~/fox_${{ github.event.inputs.manifest_branch }}/${{ github.event.inputs.device_path }}

      - name: Patch fstab, BoardConfig, fox_cepheus.mk & twrp.flags ke ext4-only + anti-bootloop
        run: |
          cd ~/fox_${{ github.event.inputs.manifest_branch }}/${{ github.event.inputs.device_path }}
          FSTAB="recovery/root/system/etc/recovery.fstab"
          TWRPFLAGS="recovery/root/system/etc/twrp.flags"
          BOARDCFG="BoardConfig.mk"
          FOXCFG="fox_cepheus.mk"
          DEVICEMK="device.mk"

          echo "=== [1/5] recovery.fstab: hapus baris f2fs /data, sisain ext4 ==="
          grep -i "userdata" "$FSTAB"
          # Hapus baris f2fs khusus /data, sisain ext4 doang
          sed -i '/userdata.*\/data.*[[:space:]]f2fs[[:space:]]/d' "$FSTAB"
          # Baris erofs di vendor/odm SENGAJA dibiarkan - itu fallback yang
          # dibutuhkan kalau ROM yang diflash pakai vendor/odm format erofs
          echo "--- sesudah ---"
          grep -i "userdata" "$FSTAB"

          echo "=== [2/5] twrp.flags: /data harus ikut ext4 (sumber bootloop kalau keluput) ==="
          grep "^/data" "$TWRPFLAGS" || true
          sed -i '/^\/data[[:space:]]/s/f2fs/ext4/' "$TWRPFLAGS"
          echo "--- sesudah ---"
          grep "^/data" "$TWRPFLAGS"

          echo "=== [3/5] BoardConfig.mk: fs type + force format + disable f2fs recovery ==="
          sed -i 's/BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := f2fs/BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := ext4/' "$BOARDCFG"
          sed -i '/TARGET_USERIMAGES_USE_F2FS/d' "$BOARDCFG"
          grep -q "^TW_FORCE_DATA_FORMAT" "$BOARDCFG" || echo "TW_FORCE_DATA_FORMAT := true" >> "$BOARDCFG"
          grep -q "^TW_USE_F2FS" "$BOARDCFG" || echo "TW_USE_F2FS := false" >> "$BOARDCFG"
          grep -q "^TARGET_USERIMAGES_USE_F2FS" "$BOARDCFG" || echo "TARGET_USERIMAGES_USE_F2FS := false" >> "$BOARDCFG"

          echo "=== [4/5] fox_cepheus.mk: force ext4 + wipe metadata after format ==="
          sed -i '/OF_UNBIND_SDCARD_F2FS/d' "$FOXCFG"
          grep -q "^OF_FORCE_DATA_FORMAT_EXT4" "$FOXCFG" || echo "OF_FORCE_DATA_FORMAT_EXT4 := 1" >> "$FOXCFG"
          grep -q "^OF_WIPE_METADATA_AFTER_DATAFORMAT" "$FOXCFG" || echo "OF_WIPE_METADATA_AFTER_DATAFORMAT := 1" >> "$FOXCFG"

          echo "=== [5/5] device.mk: fix fscrypt policy mismatch (kunci anti-bootloop) ==="
          grep -q "^OF_FIX_DECRYPTION_ON_DATA_MEDIA" "$DEVICEMK" || echo "OF_FIX_DECRYPTION_ON_DATA_MEDIA := 1" >> "$DEVICEMK"

          echo "=== Verifikasi akhir ==="
          echo "--- recovery.fstab (userdata) ---"; grep -i userdata "$FSTAB"
          echo "--- twrp.flags (/data) ---"; grep "^/data" "$TWRPFLAGS"
          echo "--- BoardConfig.mk (f2fs residu?) ---"; grep -iE "file_system_type|f2fs" "$BOARDCFG" || echo "(bersih)"
          echo "--- fox_cepheus.mk ---"; grep -iE "OF_FORCE_DATA_FORMAT_EXT4|OF_WIPE_METADATA" "$FOXCFG"
          echo "--- device.mk ---"; grep -i "OF_FIX_DECRYPTION" "$DEVICEMK"

      - name: Build
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          cd ~/fox_${{ github.event.inputs.manifest_branch }}
          source build/envsetup.sh
          export FOX_ENABLE_KERNELSU_NEXT_SUPPORT=0
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export LC_ALL=C
          lunch ${{ github.event.inputs.lunch_target }}
          mka ${{ github.event.inputs.build_target }} -j$(nproc --all)

      - name: Locate output
        id: out
        run: |
          OUT_DIR=~/fox_${{ github.event.inputs.manifest_branch }}/out/target/product/${{ github.event.inputs.device_name }}
          echo "out_dir=$OUT_DIR" >> $GITHUB_OUTPUT
          ls -la "$OUT_DIR" | grep -iE 'orangefox|recovery|\.img|\.zip' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-cepheus-ext4-antibootloop-${{ github.run_number }}
          path: |
            ${{ steps.out.outputs.out_dir }}/OrangeFox*.zip
            ${{ steps.out.outputs.out_dir }}/recovery.img
          if-no-files-found: warn
          retention-days: 14
